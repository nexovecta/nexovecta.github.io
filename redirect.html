<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ef4444'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E🚧%3C/text%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" href="https://nexovecta.github.io/favicon.png" />  
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #050508;
            --text: #f0f0f5;
            --text-muted: #6b6b7b;
            --accent: #6366f1;
            --accent-2: #ec4899;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }


        .bg-mesh {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 60% 50% at 50% 50%, rgba(239,68,68,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 30% 30%, rgba(245,158,11,0.05) 0%, transparent 50%);
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            pointer-events: none;
            animation: scanlineMove 8s linear infinite;
        }

        @keyframes scanlineMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }


        .glitch-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 32px;
        }

        .glitch-text {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--error);
            position: relative;
            animation: glitch-skew 3s infinite linear alternate-reverse;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-text::before {
            color: var(--accent);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
            transform: translate(-2px, -2px);
        }

        .glitch-text::after {
            color: var(--warning);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
            transform: translate(2px, 2px);
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); transform: translate(-2px, -2px); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 50%, 0 50%); transform: translate(3px, -1px); }
            40% { clip-path: polygon(0 40%, 100% 40%, 100% 75%, 0 75%); transform: translate(-3px, 2px); }
            60% { clip-path: polygon(0 60%, 100% 60%, 100% 90%, 0 90%); transform: translate(2px, -2px); }
            80% { clip-path: polygon(0 25%, 100% 25%, 100% 55%, 0 55%); transform: translate(-1px, 1px); }
            100% { clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); transform: translate(-2px, -2px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); transform: translate(2px, 2px); }
            20% { clip-path: polygon(0 50%, 100% 50%, 100% 80%, 0 80%); transform: translate(-2px, 1px); }
            40% { clip-path: polygon(0 30%, 100% 30%, 100% 60%, 0 60%); transform: translate(3px, -2px); }
            60% { clip-path: polygon(0 70%, 100% 70%, 100% 95%, 0 95%); transform: translate(-3px, 2px); }
            80% { clip-path: polygon(0 45%, 100% 45%, 100% 70%, 0 70%); transform: translate(1px, -1px); }
            100% { clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); transform: translate(2px, 2px); }
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(1deg); }
            60% { transform: skew(-1deg); }
            80% { transform: skew(2deg); }
            100% { transform: skew(0deg); }
        }


        .mascot {
            font-size: 80px;
            margin-bottom: 24px;
            display: inline-block;
            animation: mascot-dance 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(239,68,68,0.4));
        }

        @keyframes mascot-dance {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-3deg) scale(0.95); }
            75% { transform: rotate(8deg) scale(1.05); }
        }


        .progress-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 24px;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--error), var(--warning), var(--error));
            background-size: 200% 100%;
            border-radius: 100px;
            animation: progress-fill 3s ease-in-out forwards, progress-shimmer 1s infinite linear;
        }

        @keyframes progress-fill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes progress-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }


        .message {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            min-height: 1.5em;
        }

        .message.typing::after {
            content: '|';
            animation: blink 0.7s infinite;
            color: var(--error);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .sub-message {
            font-size: 0.875rem;
            color: var(--text-muted);
            opacity: 0.6;
            margin-bottom: 32px;
        }


        .destination-preview {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .destination-preview .url-icon {
            flex-shrink: 0;
            font-size: 1.2rem;
        }

        .destination-preview .url-text {
            opacity: 0.7;
        }


        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .back-btn:hover svg {
            transform: translateX(-4px);
        }


        .debris {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        .debris-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--error);
            opacity: 0.3;
            border-radius: 2px;
            animation: debris-fall 4s linear infinite;
        }

        @keyframes debris-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }


        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-10px); }
            20% { transform: translateX(10px); }
            30% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            50% { transform: translateX(-5px); }
            60% { transform: translateX(5px); }
            70% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
            90% { transform: translateX(-1px); }
        }


        .countdown {
            font-size: 3rem;
            font-weight: 900;
            color: var(--error);
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(239,68,68,0.5);
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="scanlines"></div>

    <div class="debris" id="debris"></div>

    <div class="container" id="main-container">
        <div class="mascot" id="mascot">🚧</div>

        <div class="glitch-wrapper">
            <div class="glitch-text" data-text="NO ACCESS">NO ACCESS</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="message typing" id="message">Preverjam dostop...</div>
        <div class="sub-message" id="sub-message">Prosim počakajte</div>

        <div class="destination-preview" id="destination-preview" style="display: none;">
            <span class="url-icon">🔗</span>
            <span class="url-text" id="url-text"></span>
        </div>

        <div class="countdown" id="countdown" style="display: none;"></div>

        <a href="index.html" class="back-btn" id="back-btn" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Nazaj na portal
        </a>
    </div>

    <script>

        const params = new URLSearchParams(window.location.search);
        const target = params.get('target');

        const destinations = {
            game: 'https://nexovecta.github.io/game.html',
            espark: 'https://nexovecta.github.io/espark.html',
            receptko: 'https://nexovecta.github.io/receptko.html'
        };

        const targetUrl = destinations[target] || 'https://nexovecta.github.io';

        const messages = [
            'Preverjam dostop...',
            'Povezujem se s strežnikom...',
            'Nalagam vire...',
            'Opravičujemo se, dostop zavrnjen!',
            'Aplikacija še ni na voljo.'
        ];

        const mascot = document.getElementById('mascot');
        const messageEl = document.getElementById('message');
        const subMessageEl = document.getElementById('sub-message');
        const container = document.getElementById('main-container');
        const progressBar = document.getElementById('progress-bar');
        const destinationPreview = document.getElementById('destination-preview');
        const urlText = document.getElementById('url-text');
        const countdownEl = document.getElementById('countdown');
        const backBtn = document.getElementById('back-btn');


        const debrisContainer = document.getElementById('debris');
        for (let i = 0; i < 15; i++) {
            const piece = document.createElement('div');
            piece.className = 'debris-piece';
            piece.style.left = Math.random() * 100 + 'vw';
            piece.style.animationDelay = Math.random() * 4 + 's';
            piece.style.animationDuration = (3 + Math.random() * 3) + 's';
            piece.style.width = (4 + Math.random() * 8) + 'px';
            piece.style.height = (4 + Math.random() * 8) + 'px';
            piece.style.background = ['#ef4444', '#f59e0b', '#6366f1', '#ec4899'][Math.floor(Math.random() * 4)];
            debrisContainer.appendChild(piece);
        }


        function typeMessage(text, element) {
            element.textContent = '';
            element.classList.add('typing');
            let i = 0;
            return new Promise(resolve => {
                const interval = setInterval(() => {
                    element.textContent += text[i];
                    i++;
                    if (i >= text.length) {
                        clearInterval(interval);
                        element.classList.remove('typing');
                        resolve();
                    }
                }, 40);
            });
        }


        async function runSequence() {

            await typeMessage(messages[0], messageEl);
            await new Promise(r => setTimeout(r, 800));


            await typeMessage(messages[1], messageEl);
            await new Promise(r => setTimeout(r, 800));


            await typeMessage(messages[2], messageEl);
            await new Promise(r => setTimeout(r, 600));


            container.classList.add('shake');
            mascot.textContent = '💥';
            mascot.style.animation = 'none';
            setTimeout(() => {
                mascot.style.animation = 'mascot-dance 0.3s ease-in-out infinite';
            }, 100);

            messageEl.style.color = '#ef4444';
            messageEl.style.fontWeight = '700';
            await typeMessage(messages[3], messageEl);

            subMessageEl.textContent = messages[4];
            subMessageEl.style.color = '#f59e0b';


            await new Promise(r => setTimeout(r, 500));
            destinationPreview.style.display = 'flex';
            urlText.textContent = targetUrl;


            await new Promise(r => setTimeout(r, 800));
            countdownEl.style.display = 'block';

            let count = 5;
            countdownEl.textContent = count;

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                    countdownEl.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        countdownEl.style.transform = 'scale(1)';
                    }, 150);
                } else {
                    clearInterval(countdownInterval);
                    countdownEl.textContent = '✋';
                    countdownEl.style.fontSize = '4rem';


                    setTimeout(() => {
                        backBtn.style.display = 'inline-flex';
                        backBtn.style.animation = 'fadeInUp 0.5s ease-out';


                        setTimeout(() => {
                            window.location.href = 'noaccess.html';
                        }, 2000);
                    }, 500);
                }
            }, 1000);
        }


        runSequence();
    </script>
</body>
</html>
